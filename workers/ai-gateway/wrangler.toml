name = "karyadex-ai-gateway"
main = "src/index.ts"
compatibility_date = "2024-05-24"
compatibility_flags = ["nodejs_compat"]

# Secrets (DO NOT COMMIT SECRETS HERE. Set via `wrangler secret put <KEY>`):
# wrangler secret put GEMINI_API_KEY
# wrangler secret put MISTRAL_API_KEY
# wrangler secret put RESEND_API_KEY
# wrangler secret put EMAIL_API_KEY
# wrangler secret put SENTRY_DSN

[vars]
# Supabase JWKS for JWT signature verification
SUPABASE_JWKS_URL = "https://<your-supabase-project-id>.supabase.co/auth/v1/.well-known/jwks.json"
MAX_DAILY_REQUESTS = "50"

# Email Service (Resend integration)
RESEND_FROM_EMAIL = "noreply@yourdomain.com"
RESEND_FROM_NAME = "KaryaDEX"
APP_BASE_URL = "https://yourdomain.com"

# Monitoring
ENVIRONMENT = "production"

# Workers KV namespace for quota tracking
# Create via: wrangler kv:namespace create QUOTA_KV
[[kv_namespaces]]
binding = "QUOTA_KV"
id = "<YOUR_KV_NAMESPACE_ID>"
preview_id = "<YOUR_KV_PREVIEW_NAMESPACE_ID>"
